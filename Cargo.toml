[workspace]
resolver = "3"
members = [
    "crates/*"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Suberlin Sinaga<suberlinsinaga@gmail.com>"]

[workspace.dependencies]
async-trait = "0.1.92"
anyhow = "1.0.104"
serde = "1.0.229"
rust_decimal = "1.42.1"
reqwest = "0.13.4"
serde_qs = "1.1.3"
argus = { git = "ssh://git@github.com/saians07/argus.git", branch = "master" , features = ["errors"]}
hmac = "0.13.0"
hex = "0.4.3"
sha2 = "0.11.0"

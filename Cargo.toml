[package]
name = "hydra"
version = "0.1.0"
edition = "2024"
authors = ["Suberlin Sinaga<suberlinsinaga@gmail.com>"]

[dependencies]
argus = { path = "../argus/crates/argus", features = ["logs", "errors"] }
async-trait = "0.1.92"
anyhow = "1.0.104"
mockito = "1.7.2"
serde = "1.0.229"
rust_decimal = "1.42.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde_qs = "1.1.3"
serde_json = "1.0.151"
hmac = "0.13.0"
hex = "0.4.3"
sha2 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
secrecy = { version = "0.10.3", features = ["serde"] }
polars = { version = "0.55.2", features = ["lazy", "json", "dtype-decimal", "diff", "abs", "strings"] }
tokio.workspace = true

[features]
indodax = []

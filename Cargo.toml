[package]
name = "hydra"
version = "0.1.1"
edition = "2024"

[dependencies]
argus = { git = "https://github.com/saians07/argus.git", features = ["logs", "errors"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1.92"
anyhow = "1.0.104"
rust_decimal = "1.42.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde = "1.0.229"
secrecy = { version = "0.10.3", features = ["serde"] }
sha2 = "0.11.1"
hmac = "0.13.0"
hex = "0.4.3"
dotenv = "0.15.0"
chrono = { version = "0.4.45", features = ["serde"] }
polars = { version = "0.55.2", features = ["lazy", "json", "dtype-decimal", "diff", "abs", "strings"] }
serde_json = "1.0.154"
serde_with = "3.25.0"

[features]
binance = []
